function moodText(){return st.mood!==null?faces[st.mood][0]:(st.score!==null?st.score+' de 10':'Sin elegir')}

if(a.phase==='done')content='<div class="notice"><strong>'+({diario:'Cerraste tu página. El texto se borró.',respiracion:'Terminaste la pausa de respiración.',sentidos:'Llegaste al final del recorrido.'}[sub]||'Terminaste esta actividad.')+'</strong><p>Puedes volver a tu espacio o probar algo diferente.</p></div><div class="btnrow">'+link('inicio','Volver a mi espacio','home')+action('repeat','Repetir actividad','','btn outline')+'</div>';
else if(sub==='respiracion'){content='<h2>Una pausa al ritmo del aire</h2><p>Si te resulta cómodo, sigue el círculo: toma aire cuando crece y suéltalo cuando se hace pequeño. Respira a tu ritmo, sin retener el aire.</p><div class="breathstage"><div id="orb" class="orb '+(a.phase==='running'?'growing':'')+'">'+(a.phase==='ready'?'A tu ritmo':a.phase==='paused'?'En pausa':a.elapsed%8<4?'Toma aire':'Suelta el aire')+'</div></div><p class="small" id="breath-time">'+(a.phase==='ready'?'4 ciclos suaves · 32 segundos':(32-a.elapsed)+' segundos restantes')+'</p><div class="btnrow">'+action(a.phase==='running'?'pause':'breathe',a.phase==='running'?'Pausar':a.phase==='paused'?'Continuar':'Comenzar','wind')+link('bienestar','Salir de la actividad','','secondary')+'</div>'}
else if(sub==='sentidos'){let d=senses[a.step];content='<div class="mini-label">Paso '+(a.step+1)+' de 5</div><div class="meter"><i style="width:'+((a.step+1)*20)+'%"></i></div><h2>'+(['Mira a tu alrededor','Nota las texturas','Escucha tu entorno','Reconoce los aromas','Recuerda un sabor'][a.step])+'</h2><p>'+d[1]+'</p><p class="small">Puedes omitir cualquier sentido que no puedas o no quieras usar.</p><div class="btnrow">'+action('sense-next',a.step===4?'Terminar':'Siguiente paso','arrow')+action('sense-next','Omitir este sentido','','secondary')+'</div>'}
else if(sub==='diario'){content='<h2>Una página solo para este momento</h2><p>Prueba con una frase inventada, como «Hoy me alegró caminar por el parque». Evita datos personales.</p><label for="journal"><strong>Mi frase de ejemplo</strong></label><textarea id="journal" class="journal" maxlength="600" autocomplete="off" spellcheck="false" placeholder="Hoy me sentí…"></textarea><p class="small">Este texto se borra al cerrar la página o cambiar de pantalla.</p><div class="btnrow">'+action('journal-done','Cerrar y borrar','check')+action('journal-clear','Borrar texto','','secondary')+'</div>'}
else if(sub==='reconocer'){content='<h2>¿Qué podría sentir Luna?</h2><p>Luna llegó a un grupo nuevo. Quiere participar, pero todavía no conoce a nadie.</p><div class="choices">'+['Curiosidad','Nervios','Varias emociones'].map(t=>action('practice:'+t,t,'','choice '+(a.pick===t?'on':''),'aria-pressed="'+(a.pick===t)+'"')).join('')+'</div>'+(a.pick?'<div class="notice">'+({'Curiosidad':'Puede tener ganas de conocer a las demás personas.','Nervios':'Puede sentir nervios al entrar en un lugar nuevo.','Varias emociones':'La curiosidad y los nervios pueden aparecer al mismo tiempo.'}[a.pick])+' Para saberlo, podríamos preguntarle a Luna.</div><div class="btnrow">'+action('done','Terminar','check')+'</div>':'')}
else if(sub==='autocuidado'){content='<h2>Elige un gesto pequeño</h2><p>Imagina que tienes un rato libre. ¿Qué te gustaría hacer?</p><div class="choices">'+['Descansar un momento','Moverme un poco','Saludar a alguien'].map(t=>action('practice:'+t,t,'','choice '+(a.pick===t?'on':''),'aria-pressed="'+(a.pick===t)+'"')).join('')+'</div>'+(a.pick?'<div class="notice">'+({'Descansar un momento':'Busca una postura cómoda y aparta la vista de la pantalla un momento.','Moverme un poco':'Elige un movimiento que te resulte cómodo, como estirar las manos.','Saludar a alguien':'Piensa en alguien con quien te guste hablar. Un saludo puede bastar.'}[a.pick])+'</div><div class="btnrow">'+action('done','Terminar','check')+'</div>':'')}
else if(sub==='kit'){content='<h2>Arma tu kit de calma</h2><p>Elige recursos para tenerlos a mano mientras exploras esta demo.</p><div class="chips">'+res.slice(0,5).map(r=>action('fav:'+r.id,r.title,st.saved.includes(r.id)?'check':'bookmark','chip '+(st.saved.includes(r.id)?'on':''),'aria-pressed="'+st.saved.includes(r.id)+'"')).join('')+'</div>'+action('my-favs','Abrir mis favoritos','arrow')}
return '<div class="activitytop">'+link('bienestar','Todas las herramientas','back','inlink')+'<span class="small">'+x.time+'</span></div>'+head('Herramienta · '+x.cat,x.title)+'<div class="panel flow">'+content+'</div>'}
</script>
<script>const chatRules = [
  {
    id: 'ayuda',
    match: /\b(suicid\w*|autolesion\w*|abus\w*|en peligro|me (?:pega|golpea|amenaza)\w*|(?:quiero|voy a|pienso en) (?:morir\w*|matarme|hacerme dano|lastimarme)|no quiero (?:vivir|seguir viviendo))\b/,
    first: 'Si esto te está pasando, busca ahora a una persona de confianza que pueda acompañarte. Si hay peligro inmediato, pide que contacten a emergencias. Puedes abrir «Necesito ayuda ahora».',
    next: '¿Hay alguien cerca a quien puedas pedir compañía mientras buscas ayuda? El botón de ayuda muestra opciones según el lugar que elijas.'
  },
  {
    id: 'acoso', match: /\b(acoso|bullying|burl\w*|insult\w*|molestan|amenaz\w*)\b/,
    first: 'Que se burlen de alguien puede doler. Puedes contárselo a alguien de confianza. ¿Quieres pensar en cómo empezar esa conversación?',
    next: 'Podrías empezar con «Hay algo que está pasando y me vendría bien que me escucharas». ¿A quién te sentirías cómodo pidiéndole apoyo?'
  },
  {
    id: 'tristeza', match: /\b(trist\w*|sol[oa]|soledad|deprim\w*|llor\w*|desanim\w*|me siento mal|estoy mal|no (?:estoy|me siento) (?:muy )?(?:bien|feliz|content[oa]))\b/,
    first: 'Suena como un momento difícil. ¿Qué parte de tu día te gustaría contar?',
    next: '¿Preferirías compartirlo con alguien de confianza o darte un momento de descanso?'
  },
  {
    id: 'estudios', match: /\b(exam\w*|clas[ei]\w*|tareas?|colegio|escuela|universidad|estudi\w*|notas|academi\w*)\b/,
    first: 'Parece que los estudios ocupan tu atención. ¿Qué parte te preocupa más en este momento?',
    next: 'Si eligieras una sola cosa para empezar, ¿sería repasar algo pequeño o pedir que te aclaren una duda?'
  },
  {
    id: 'amistades', match: /\b(amig\w*|amistad\w*|grupo|companero\w*|companera\w*|pareja)\b/,
    first: '¿Qué pasó entre ustedes y cómo te hizo sentir?',
    next: 'Si pudieras decirle una cosa a esa persona con calma, ¿qué te gustaría que entendiera?'
  },
  {
    id: 'familia', match: /\b(familia\w*|mama|papa|madre|padre|herman\w*|en casa)\b/,
    first: '¿Qué parte de lo que pasa en casa te gustaría contar?',
    next: '¿Hay alguien de confianza con quien te gustaría hablar de eso?'
  },
  {
    id: 'enojo', match: /\b(enoj\w*|rabia|furi\w*|frustr\w*|enfad\w*|brav[oa])\b/,
    first: '¿Recuerdas qué ocurrió justo antes de sentir esa rabia o frustración?',
    next: '¿Te gustaría ponerlo en palabras o tomar una pausa antes de decidir qué hacer?'
  },
  {
    id: 'preocupacion', match: /\b(nervi\w*|estres\w*|ansi\w*|agobi\w*|miedo|preocup\w*|inquiet\w*)\b/,
    first: '¿Qué es lo que más te inquieta de esa situación?',
    next: '¿Hay una parte pequeña que puedas resolver hoy, o alguien a quien puedas pedir una mano?'
  },
  {
    id: 'alegria', match: /\b(feliz|alegr\w*|content\w*|emocionad\w*|bien|orgull\w*)\b/,
    first: '¿Qué pasó que te gustaría recordar de ese momento?',
    next: '¿Te gustaría guardar ese recuerdo en una frase o compartirlo con alguien?'
  }
];

const kidReplies = {
  estudios: '¿Qué pasó en clase? Puedes contarme un pedacito.',
  tristeza: 'A veces un día se siente triste. ¿Pasó algo que quieras contar?',
  preocupacion: '¿Qué cosa te está preocupando hoy?',
  alegria: '¿Qué fue lo más bonito que pasó?',
  amistades: '¿Qué pasó con esa persona cuando estaban juntos?',
  ayuda: 'Si algo te está haciendo daño, busca ahora a una persona mayor que te cuide y cuéntaselo. Si hay peligro, pídele que llame a emergencias.'
};

function respondToMessage(message) {
  const words = message.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  const rule = chatRules.find(item => item.match.test(words));
  if (rule) {
    const previousTopic = st.chatTopic;
    st.chatTopic = rule.id;
    if (rule.id === 'ayuda') st.showChatHelp = true;
    if (previousTopic === rule.id) return rule.next;
    return (st.age === 'kid' && kidReplies[rule.id]) || rule.first;
  }
  if (/\b(hola|buenos dias|buenas tardes|buenas noches|buenas|hey)\b/.test(words)) {
    return st.age === 'kid' ? '¡Hola! ¿Qué tal estuvo tu día?' : '¡Hola! ¿De qué te gustaría hablar hoy?';
  }
  if (/\b(gracias|muchas gracias)\b/.test(words)) {
    return 'De nada. Puedes seguir escribiendo o cerrar la conversación cuando quieras.';
  }
  if (/\b(adios|hasta luego|chao)\b/.test(words)) {
    return 'Hasta luego. Cuando quieras cerrar este ejemplo, pulsa «Terminar aquí».';
  }
  const lastRule = chatRules.find(item => item.id === st.chatTopic);
  if (lastRule) {
    st.chatTopic = '';
    return lastRule.next;
  }
  if (st.chat.length === 0) {
    return '¿Cómo te hizo sentir eso? Si quieres, puedes empezar con una palabra.';
  }
  return '¿Prefieres contar un poco más, probar una pausa o pensar a quién pedir apoyo?';
}

function resetChat() {
  st.chat = [];
  st.chatKind = '';
  st.chatTopic = '';
  st.showChatHelp = false;
  st.chatDraft = '';
}

function chatControls() {
  if (st.chatKind === 'end') {
    return '<div class="btnrow">' + action('restart-chat', 'Otro ejemplo', 'chat') +
      link('inicio', 'Volver a mi espacio', 'home', 'btn outline') + '</div>';
  }
  const suggestions = st.chat.length ? '' : '<div class="choices">' +
    topics[st.age].map((topic, index) => action('topic:' + index, topic, '', 'choice')).join('') +
    '</div>';
  const support = st.showChatHelp || st.chatKind === 'talk'
    ? link('ayuda', 'Ver opciones de apoyo', 'hand', 'btn outline') : '';
  const exercise = st.chatKind === 'rest' ? link('bienestar/respiracion', 'Probar respiración', 'wind') : '';
  const nextSteps = st.chat.length ? '<div class="choices">' +
    action('path:talk', st.age === 'kid' ? 'Pedir ayuda a un adulto' : 'Hablar con alguien de confianza', 'users', 'choice') +
    action('path:rest', 'Probar una pausa', 'leaf', 'choice') +
    action('finish-chat', 'Terminar aquí', 'check', 'choice') + '</div>' : '';
  return '<form id="chat-form" autocomplete="off">' +
    '<label for="chat-message">Tu mensaje</label><div class="chat-entry">' +
    '<input id="chat-message" type="text" maxlength="400" enterkeyhint="send" placeholder="Escribe una frase de ejemplo…" required>' +
    '<button type="submit" class="btn">Enviar ' + ico('arrow') + '</button></div></form>' +
    suggestions + (exercise || support ? '<div class="btnrow">' + exercise + support + '</div>' : '') + nextSteps;
}

function chat() {
  return head('Conversación de muestra', 'Hablar con Hope',
    'Prueba con una frase inventada. Hope usa respuestas preparadas en este dispositivo.') +
    '<section class="panel flow chat-panel"><div class="profile-info"><span class="avatar">' +
    ico('sprout') + '</span><div><strong>Hope</strong><div class="small">Simulación · ' +
    ages[st.age].name + '</div></div></div><div class="chatlog" role="log" aria-label="Conversación con Hope"></div>' +
    '<div class="chat-controls">' + chatControls() + '</div></section>';
}

function appendBubble(log, speaker, message) {
  const bubble = document.createElement('div');
  bubble.className = speaker === 'Tú' ? 'bubble user' : 'bubble';
  const name = document.createElement('b');
  name.textContent = speaker;
  const body = document.createElement('p');
  body.textContent = message;
  bubble.append(name, body);
  log.append(bubble);
}

function showChat() {
  const log = $('.chatlog');
  const greeting = st.age === 'kid' ? '¡Hola! Soy Hope. ¿Cómo te sientes hoy?' :
    '¡Hola! Soy Hope. ¿Qué te gustaría contarme hoy?';
  appendBubble(log, 'Hope', [greeting, st.context].filter(Boolean).join(' '));
  for (const [speaker, message] of st.chat) appendBubble(log, speaker, message);
  log.scrollTop = log.scrollHeight;
  if ($('#chat-message')) $('#chat-message').value = st.chatDraft;
}

function addExchange(message, answer, kind = '', focusInput = true) {
  st.chatKind = kind;
  st.chat.push(['Tú', message], ['Hope', answer]);
  const log = $('.chatlog');
  appendBubble(log, 'Tú', message);
  appendBubble(log, 'Hope', answer);
  log.scrollTop = log.scrollHeight;
  $('.chat-controls').innerHTML = chatControls();
  const input = $('#chat-message');
  if (input) {
    input.value = st.chatDraft;
    if (focusInput) input.focus({preventScroll:true});
  } else {
    $('.chat-controls button').focus({preventScroll:true});
  }
}

document.addEventListener('input', event => {
  if (event.target.id === 'chat-message') {
    st.chatDraft = event.target.value;
    event.target.setCustomValidity('');
  }
});

document.addEventListener('submit', event => {
  if (event.target.id !== 'chat-form') return;
  event.preventDefault();
  const input = $('#chat-message');
  const message = input.value.trim().slice(0, input.maxLength);
  if (!message) {
    input.setCustomValidity('Escribe una palabra o elige una frase de ejemplo.');
    input.reportValidity();
    return;
  }
  st.chatDraft = '';
  addExchange(message, respondToMessage(message));
});
</script>
<script>function infoCard(t,p){return '<article class="infocard"><h3>'+t+'</h3><p>'+p+'</p></article>'}
function disclosure(t,p){return '<details><summary>'+t+'</summary><p>'+p+'</p></details>'}
function family(){let teacher=route==='educadores';return head('Orientación','Familias y docentes','Ideas para acompañar una conversación sin invadir el espacio de la persona joven.')+'<div class="filters">'+link('familias','Para familias','users','filter '+(!teacher?'on':''))+link('educadores','Para docentes','book','filter '+(teacher?'on':''))+'</div><div class="learn flow">'+(teacher?infoCard('Abre una conversación en privado','Puedes empezar con una observación concreta: «Hoy te vi más callado. ¿Quieres hablar o prefieres otro momento?». Da tiempo para responder.')+infoCard('Si un estudiante cuenta una situación de acoso','Escucha sin pedirle que relate todo en público. Pregunta qué necesita para sentirse acompañado y busca al equipo de orientación según la ruta de tu institución.'):infoCard('Escucha antes de intentar resolver','Prueba con «Gracias por contármelo. ¿Prefieres que te escuche o que pensemos juntos qué hacer?». Evita minimizar su experiencia.')+infoCard('Acuerda un siguiente paso','Si el malestar persiste o afecta su vida cotidiana, puedes ofrecer acompañarle a consultar con un profesional. Si hay peligro inmediato, busca ayuda de emergencias.'))+disclosure('¿Puedo ver el recorrido de otra persona?','No hay informes familiares ni docentes sobre la actividad de otras personas. Pueden explorar un ejemplo juntos, si lo desean.')+'</div><div class="btnrow">'+link('bullying','Explorar prevención del acoso','shield','btn outline')+'</div>'}
function bullying(){return head('Orientación','Cuando algo parece acoso','Puedes pedir apoyo aunque todavía no sepas cómo llamar a lo que pasó.')+'<div class="learn flow">'+infoCard('Un desacuerdo o una agresión repetida','Un conflicto puede surgir por una diferencia puntual. En el acoso, alguien agrede o excluye repetidamente y hay un desequilibrio de poder. Un solo incidente grave también merece atención.')+disclosure('Si ocurre en redes o en un chat','No tienes que responder ni reenviar mensajes que te dañen. Si hacerlo es seguro, conserva un registro sin difundirlo y pide ayuda para bloquear o reportar la cuenta. No guardes ni reenvíes imágenes íntimas de menores.')+disclosure('Cómo pedir ayuda en la escuela','Elige a una persona adulta de confianza, por ejemplo, un docente u orientador. Puedes decir: «Algo está pasando y necesito que me ayudes a sentirme a salvo». Evita enfrentarte a solas a quien te está haciendo daño.')+disclosure('Si quien te preocupa es un adulto','Puedes acudir a otra persona adulta de confianza fuera de esa situación. Si estás en peligro inmediato, aléjate si puedes hacerlo con seguridad y pide ayuda de emergencias.')+'</div><div class="btnrow">'+link('ayuda','Ver opciones de apoyo','life')+link('educadores','Orientaciones para docentes','book','btn outline')+'</div>'}
function guide(){return head('Acerca de HopeLine','Cómo funciona la simulación','HopeLine Connect muestra cómo podría ser un espacio de acompañamiento emocional para personas de 5 a 20 años.')+'<div class="learn flow">'+infoCard('01 · Elige un recorrido','Entra por «Quiero hablar» y escoge una edad ficticia. El lenguaje y las opciones cambian con el perfil.')+infoCard('02 · Prueba una conversación','Puedes elegir una emoción u omitirla. Escribe un mensaje ficticio o elige una sugerencia. Hope responde en el dispositivo mediante reglas sencillas.')+infoCard('03 · Explora una herramienta','Prueba una respiración, reconoce algo a tu alrededor o escribe una frase inventada. Usa el separador para reunir favoritos durante la sesión.')+disclosure('¿Necesito registrarme?','No. La simulación se abre sin cuenta ni conexión a Internet.')+disclosure('¿Qué pasa si necesito ayuda real?','El botón «Necesito ayuda ahora» muestra cómo buscar apoyo humano. Esta demo no es terapia, no diagnostica y no atiende emergencias.')+'</div><div class="btnrow">'+link('chat','Probar el recorrido','arrow')+link('privacidad','Privacidad y uso','lock','btn outline')+'</div>'}
const official='https://www1.funcionpublica.gov.co/preguntas-frecuentes/-/asset_publisher/sqxafjubsrEu/content/linea-unica-de-emergencias-nacional-123/28585938';
function helpPage(){return head('Apoyo humano','Necesito ayuda ahora','Si hay peligro inmediato, busca un lugar más seguro si puedes y pide a alguien cercano que te acompañe. Contacta a los servicios de emergencia de donde estés.')+'<section class="panel flow"><h2>Ver recursos por ubicación</h2><p class="small">La selección es voluntaria. Esta demo no detecta dónde estás ni inicia llamadas.</p><label for="region"><strong>País o región</strong></label><br><select id="region"><option value="">Seleccionar ubicación</option><option value="co" '+(st.region==='co'?'selected':'')+'>Colombia</option><option value="other" '+(st.region==='other'?'selected':'')+'>Otro país / prefiero no decirlo</option></select><div id="region-info">'+regionInfo()+'</div><hr class="divider"><h2>Cuéntaselo a alguien de confianza</h2><p>'+(st.age==='kid'?'Busca a una persona mayor que te cuide. Puedes decirle: «Necesito ayuda. ¿Te quedas conmigo?».':'Puedes decir: «Necesito apoyo ahora. ¿Puedes quedarte conmigo mientras buscamos ayuda?».')+'</p><p class="small">Esta simulación no envía alertas y ninguna persona está supervisando esta pantalla.</p></section>'}
function regionInfo(){return st.region==='co'?'<div class="helpbox"><h2>123 · Emergencias en Colombia</h2><p>Si hay peligro inmediato, llama al 123 desde un teléfono o pide a alguien que llame contigo.</p><a class="under small" href="'+official+'" target="_blank" rel="noopener noreferrer">Fuente oficial: Función Pública ↗</a></div>':st.region==='other'?'<p class="notice">Consulta el número oficial de emergencias de tu localidad o pide a una persona cercana que te ayude a llamar.</p>':''}
function privacy(){return head('Sobre esta demo','Privacidad y uso','Puedes recorrer HopeLine con ejemplos ficticios, sin registrarte.')+'<div class="panel flow"><h2>Lo que eliges en esta sesión</h2><p>El perfil, los favoritos y los mensajes del chat solo existen en la memoria de esta pestaña. Al recargar o reiniciar, desaparecen. El diario se borra cuando sales de su pantalla.</p><p>No se envían conversaciones, no hay geolocalización ni se usan servicios de inteligencia artificial. La ficha de ayuda contiene un enlace externo oficial que puedes abrir por separado.</p><hr class="divider"><h2>Preferencias de lectura</h2><div class="btnrow">'+action('size',large?'Restablecer tamaño de letra':'Aumentar tamaño de letra','font','btn outline','aria-pressed="'+large+'"')+action('theme',dark?'Usar modo claro':'Usar modo oscuro',dark?'sun':'moon','btn outline')+'</div><hr class="divider"><h2>Reiniciar el ejemplo</h2><p>Se borrarán las elecciones y volverás al inicio.</p>'+action('reset','Borrar sesión de prueba','back','btn outline')+'<div class="btnrow">'+link('terminos','Ver los términos de la simulación','','under')+'</div></div>'}
function terms(){return head('Sobre esta demo','Términos de la simulación')+'<div class="panel flow"><h2>Un prototipo para revisar la interfaz</h2><p>Usa datos ficticios. Esta demostración no presta atención clínica, no diagnostica ni vigila situaciones de riesgo. No existe atención humana dentro de HopeLine.</p><p>Para ofrecer un servicio real a menores harían falta revisión profesional, autorizaciones, pruebas supervisadas y medidas de privacidad acordes con ese servicio.</p>'+link('privacidad','Volver a privacidad','back','inlink')+'</div>'}
function readRoute(){let [r,s]=location.hash.replace(/^#\/?/,'').split('/');return [Object.hasOwn(names,r)?r:'inicio',s||'']}
function enter(){drawer=false;let [r,s]=readRoute();if(r==='bienestar'&&s&&!res.some(x=>x.id===s))s='';if(['chat','emociones'].includes(r)&&!st.age){st.next=r;st.ageDraft=null;route='bienvenida';sub='';if(location.hash!=='#/bienvenida'){location.replace('#/bienvenida');return}}
if((r!==route||s!==sub)&&route==='bienestar')resetActivity();if(r==='bienestar'&&s&&(route!==r||sub!==s))resetActivity();previous=route;route=r;sub=s;if(route==='emociones'){st.pick=st.age==='kid'?st.mood:st.score}
draw(true)}
let first=true;
function draw(nav){let old= document.activeElement;let oldAction=old?.dataset?.act;let oldTitle=old?.getAttribute('aria-label');let jr=$('#journal')?.value;let pos=jr!==undefined&&old?.id==='journal'?old.selectionStart:null;
document.documentElement.dataset.theme=dark?'dark':'light';document.documentElement.classList.toggle('large',large);frame();
const renderers={inicio:home,panel:home,bienvenida:welcome,emociones:emotions,chat,bienestar:sub?activity:library,guia:guide,bullying,familias:family,educadores:family,privacidad:privacy,ayuda:helpPage,terminos:terms};$('#main').innerHTML=(renderers[route]||home)();
if(route==='chat')showChat();
if(!nav&&jr!==undefined&&$('#journal')){$('#journal').value=jr;if(pos!==null){$('#journal').focus();$('#journal').setSelectionRange(pos,pos)}}
if(nav){if(!first){window.scrollTo(0,0);$('#main').focus({preventScroll:true})}first=false}else if(oldAction){let choices=Array.from(document.querySelectorAll('[data-act]')).filter(x=>x.dataset.act===oldAction&&!x.disabled);let el=choices.find(x=>x.getAttribute('aria-label')===oldTitle)||choices[0];if(el)el.focus({preventScroll:true});else if(document.activeElement===document.body)$('#main').focus({preventScroll:true})}
if(sub==='respiracion'&&st.activity?.phase==='running'&&$('#orb'))$('#orb').style.animationDelay='-'+st.activity.elapsed+'s';}
function startBreath(){let a=st.activity;if(a.phase==='running')return;if(a.phase==='ready')a.elapsed=0;a.phase='running';draw(false);say(a.elapsed%8<4?'Toma aire':'Suelta el aire');let offset=a.elapsed,start=performance.now();clearInterval(timer);timer=setInterval(()=>{let e=Math.min(32,offset+Math.floor((performance.now()-start)/1000));if(e===a.elapsed)return;let old=a.elapsed;a.elapsed=e;if(e>=32){finishActivity();return}let phase=e%8<4?'Toma aire':'Suelta el aire';$('#orb').textContent=phase;$('#breath-time').textContent=(32-e)+' segundos restantes';if(Math.floor(old/4)!==Math.floor(e/4))say(phase)},180)}
function quick(i){st.pendingFace=i;if(!st.age){st.next='emociones';st.ageDraft=null;go('bienvenida');return}if(st.age==='kid')st.mood=i;else{st.mood=i;st.score=null}st.pendingFace=null;go('emociones')}
function handle(a){
const idx=a.indexOf(':'),k=idx<0?a:a.slice(0,idx),v=idx<0?'':a.slice(idx+1);
switch(k){
case 'menu':drawer=true;syncDrawer();$('.drawer-close').focus();return;
case 'menu-close':drawer=false;syncDrawer();$('.hamb').focus();return;
case 'theme':dark=!dark;draw(false);say(dark?'Modo oscuro':'Modo claro');return;
case 'size':large=!large;draw(false);say(large?'Letra grande':'Tamaño normal');return;
case 'profile':st.ageDraft=st.age;st.next='inicio';st.pendingFace=null;go('bienvenida');return;
case 'age':st.ageDraft=v;draw(false);return;
case 'age-ok':{if(!ages[st.ageDraft])return;let target=st.next||'inicio',pending=st.pendingFace,nd=st.ageDraft;if(st.age!==nd){st=fresh();st.age=nd}st.ageDraft=nd;st.next='inicio';if(pending!==null){st.mood=pending;st.score=null}st.pendingFace=null;if(target==='chat'&&previous!=='chat')go('emociones');else go(target);return}
case 'quick':quick(Number(v));return;
case 'pick':st.pick=Number(v);draw(false);return;
case 'reason':st.reason=st.reason===v?'':v;draw(false);return;
case 'mood-ok':{if(st.age==='kid'){st.mood=st.pick;st.score=null}else{st.score=st.pick;if(st.pick!==null)st.mood=null}st.context=(st.mood!==null?'La carita que elegiste fue «'+faces[st.mood][0]+'».':st.score!==null?'Elegiste '+st.score+' de 10 en el ejemplo.':'')+(st.reason&&st.reason!=='Prefiero no responder'?' Elegiste «'+st.reason+'» como tema.':'');resetChat();go('chat');return}
case 'mood-skip':st.context='';resetChat();st.mood=null;st.score=null;st.reason='';go('chat');return;
case 'topic':
  if (!st.chat.length) addExchange(topics[st.age][Number(v)], replies[st.age][Number(v)]);
  return;
case 'finish-chat':
  st.chatDraft = '';
  addExchange('Prefiero terminar aquí.', 'Gracias por probar este ejemplo. Puedes volver a tu espacio cuando quieras.', 'end');
  return;
case 'path': {
  const child = st.age === 'kid';
  if (v === 'rest') {
    addExchange('Quiero probar una pausa.', 'Puedes empezar la respiración guiada con el botón «Probar respiración».', 'rest', false);
  } else {
    const answer = child ? 'Busca a una persona mayor que te cuide. Puedes decirle «¿Podemos hablar un momento?».'
      : 'Puedes empezar con «Hay algo que me preocupa. ¿Tienes un momento para escucharme?». Elige a alguien con quien te sientas a salvo.';
    addExchange('Quiero hablar con alguien.', answer, 'talk', false);
  }
  $('.chat-controls .btnrow a')?.focus({preventScroll:true});
  return;
}
case 'restart-chat':
  resetChat();
  st.context = '';
  draw(false);
  $('#chat-message').focus();
  say('Nuevo diálogo de ejemplo');
  return;
case 'filter':st.filter=v;draw(false);return;
case 'fav':{const had=st.saved.includes(v);st.saved=had?st.saved.filter(x=>x!==v):[...st.saved,v];draw(false);say(had?'Recurso retirado de favoritos':'Recurso añadido a favoritos');return}
case 'my-favs':st.filter='Favoritos';go('bienestar');return;
case 'breathe':startBreath();return;
case 'pause':clearInterval(timer);timer=null;st.activity.phase='paused';draw(false);say('Respiración en pausa');return;
case 'repeat':resetActivity();draw(false);return;
case 'sense-next':if(st.activity.step>=4)finishActivity();else{st.activity.step++;draw(false);say('Paso '+(st.activity.step+1)+': '+senses[st.activity.step][1])}return;
case 'practice':st.activity.pick=v;draw(false);say($('.notice')?.textContent||'Elección registrada');return;
case 'journal-clear':$('#journal').value='';$('#journal').focus();say('Texto borrado');return;
case 'journal-done':if($('#journal'))$('#journal').value='';finishActivity();return;
case 'done':finishActivity();return;
case 'reset':clearInterval(timer);st=fresh();go('inicio');say('Sesión de prueba borrada');return;
}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el){handle(el.dataset.act);return}if(e.target.closest('.skip')){e.preventDefault();$('#main').focus();return}const a=e.target.closest('a');if(a&&drawer){drawer=false;syncDrawer();if(a.hash===location.hash)$('#main').focus()}});
document.addEventListener('change',e=>{if(e.target.id==='region'){st.region=e.target.value;$('#region-info').innerHTML=regionInfo();say($('#region-info').textContent)}});
document.addEventListener('keydown',e=>{if(!drawer)return;if(e.key==='Escape'){handle('menu-close');return}if(e.key==='Tab'){const els=Array.from($('#side').querySelectorAll('a,button')),f=els[0],l=els[els.length-1];if(e.shiftKey&&document.activeElement===f){e.preventDefault();l.focus()}else if(!e.shiftKey&&document.activeElement===l){e.preventDefault();f.focus()}}});
window.matchMedia('(max-width:760px)').addEventListener('change',syncDrawer);window.addEventListener('hashchange',enter);
window.addEventListener('pagehide',()=>{clearInterval(timer);st=fresh();const j=$('#journal');if(j)j.value='';$('#main').replaceChildren()});
window.addEventListener('pageshow',e=>{if(e.persisted){route='';sub='';enter()}});enter();
</script></body></html>
